[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-doc-pipeline"
version = "0.1.0"
description = "Pipeline Mistral Workflows de traitement de documents médicaux : OCR 4.1, classification (Mistral Small 4) avec validation humaine si confiance < 0.7, extraction (Mistral Large 4)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
